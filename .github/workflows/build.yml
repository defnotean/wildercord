  # One explicit request commit atop sourceSha; later commits make it inactive.
  # This evidence never replaces any aggregate or focused release gate above.
  native-diagnostic:
    name: native-diagnostic (not release acceptance)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: native-diagnostic-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      NATIVE_DIAGNOSTIC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CI_MINECRAFT_EULA_ACCEPTED: "true"
      NATIVE_DIAGNOSTIC_PR: ${{ github.event.pull_request.number }}
      LIBGL_ALWAYS_SOFTWARE: "1"
      SDL_VIDEO_FORCE_EGL: "1"
      ALSOFT_DRIVERS: "null"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate explicit diagnostic request and exact source revision
        id: request
        run: python tools/run_native_diagnostic_ci.py --prepare
      - uses: actions/setup-java@v6
        if: steps.request.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v7
        if: steps.request.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Install existing image-verification dependency
        if: steps.request.outputs.enabled == 'true'
        run: pip install pillow
      - uses: gradle/actions/setup-gradle@v6
        if: steps.request.outputs.enabled == 'true'
      - name: Check diagnostic request, scope and provenance tooling
        if: steps.request.outputs.enabled == 'true'
        run: python -m unittest discover -s tools -p 'test_*ci*.py' -v
      - name: Install virtual display for requested diagnostic
        if: steps.request.outputs.enabled == 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo -n timeout --kill-after=15s 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --error-on=any update
          sudo -n timeout --kill-after=15s 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb libgl1-mesa-dri libegl1 mesa-utils
          for native_package in xvfb libgl1-mesa-dri libegl1 mesa-utils; do
            native_status="$(dpkg-query --show --showformat='${db:Status-Status}' "$native_package")"
            test "$native_status" = installed
