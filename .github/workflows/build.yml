name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'wiki/**'
      - 'gitbook/**'
      - '.gitbook.yaml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/audit/**'
      - 'docs/features/**'
      - 'docs/releases/**'
      - 'tools/player_docs.py'
      - 'tools/check_player_site.py'
      - '.github/workflows/docs.yml'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v6

      # Assets, recipes, language and docs/RECIPES.md are generated from the code. If a change to
      # the runes wasn't followed by `python tools/generate_assets.py`, fail here and say so.
      - name: Check generated files are up to date
        run: |
          pip install pillow
          python tools/check_generated_assets.py

      - name: Build and run unit tests
        run: ./gradlew build --stacktrace

      - name: Check bounded packaging audit
        run: python -m unittest discover -s tools -p 'test_audit_packages.py' -v

      - name: Package pinned launcher profiles
        run: |
          task_release_jar=$(find build/libs -maxdepth 1 -name 'wildercord-*.jar' ! -name '*-sources.jar' -print -quit)
          python tools/build_profiles.py --jar "$task_release_jar"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: wildercord
          path: build/libs/*.jar

      - name: Upload launcher profiles
        uses: actions/upload-artifact@v7
        with:
          name: wildercord-profiles
          path: artifacts/profiles/*.mrpack

      - name: Audit mod and launcher packaging (not gameplay readiness)
        id: packaging
        run: python tools/audit_packages.py --output artifacts/review/packaging-report.json --distributable-directory artifacts/releases/distributable

      - name: Preserve packaging report
        if: always() && steps.packaging.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: wildercord-packaging-report
          path: artifacts/review/packaging-report.json
          if-no-files-found: error

      - name: Upload distributable mod jar only
        uses: actions/upload-artifact@v7
        with:
          name: wildercord-distributable
          path: artifacts/releases/distributable/*.jar
          if-no-files-found: error

  # Four pinned explicit groups preserve descriptor-relative order and exact disjoint coverage.
  # Historical timing is incomplete; the 180-minute cap is unchanged, not proven sufficient.
  game-tests:
    name: game-tests (${{ matrix.shard }}/4)
    env:
      FULL_CLIENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install virtual display
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo -n timeout --kill-after=15s 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --error-on=any update
          sudo -n timeout --kill-after=15s 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb libgl1-mesa-dri libegl1 mesa-utils
          for native_package in xvfb libgl1-mesa-dri libegl1 mesa-utils; do
            native_status="$(dpkg-query --show --showformat='${db:Status-Status}' "$native_package")"
            test "$native_status" = installed
            native_version="$(dpkg-query --show --showformat='${Version}' "$native_package")"
            test -n "$native_version"
            printf '%s=%s\n' "$native_package" "$native_version"
          done
          command -v Xvfb
          command -v glxinfo
      - name: Mark fresh Void Cut diagnostic inputs
        id: void-cut-start
        continue-on-error: true
        run: python tools/collect_void_cut_diagnostics.py --prepare --job-group game-tests-${{ matrix.shard }}-of-4 --marker artifacts/review/void-cut-game-tests-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Run gameplay and complete rune animation gallery
        env:
          CI_MINECRAFT_EULA_ACCEPTED: "true"
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEO_FORCE_EGL: "1"
          WILDERCORD_ANIMATION_GALLERY: "1"
        run: python tools/run_client_ci.py --shard ${{ matrix.shard }}/4 --log client-game-tests.log
      - name: Record full descriptor and optional suite outcomes
        if: always()
        run: python tools/test_manifest.py --shard ${{ matrix.shard }}/4 --log client-game-tests.log --gallery
      - name: Preserve strict full-client shard manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-client-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/review/test-manifest.json
          if-no-files-found: error
      - name: Preserve original Red Rain diagnostics (not visual acceptance)
        if: always() && hashFiles('build/run/clientGameTest/screenshots/masters_style_red_rain*.png') != ''
        uses: actions/upload-artifact@v7
        with:
          name: red-rain-native-diagnostics-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/run/clientGameTest/screenshots/masters_style_red_rain_left_turn_first_windup.png
            build/run/clientGameTest/screenshots/masters_style_red_rain_left_turn_first_windup.json
            build/run/clientGameTest/screenshots/masters_style_red_rain_first_windup.png
            build/run/clientGameTest/screenshots/masters_style_red_rain_first_windup.json
            build/run/clientGameTest/screenshots/masters_style_red_rain_left_turn_third_back_windup.json
            artifacts/review/test-manifest.json
          if-no-files-found: warn
      - name: Collect bounded Void Cut diagnostics (may include rejected frames)
        id: void-cut-diagnostics
        if: always() && steps.void-cut-start.outcome == 'success'
        continue-on-error: true
        run: python tools/collect_void_cut_diagnostics.py --job-group game-tests-${{ matrix.shard }}-of-4 --marker artifacts/review/void-cut-game-tests-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}.json --output artifacts/review/void-cut-diagnostics-game-tests-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve bounded Void Cut diagnostics
        if: always() && steps.void-cut-diagnostics.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: void-cut-diagnostics-game-tests-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/review/void-cut-diagnostics-game-tests-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Preserve original Wind flight comparison (diagnostic only)
        if: always() && hashFiles('build/run/clientGameTest/screenshots/wind_view_cushion_background.png', 'build/run/clientGameTest/screenshots/wind_view_cushion.png') != ''
        uses: actions/upload-artifact@v7
        with:
          name: wind-flight-diagnostic-${{ matrix.shard }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/run/clientGameTest/screenshots/wind_view_cushion_background.png
            build/run/clientGameTest/screenshots/wind_view_cushion.png
            artifacts/review/test-manifest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve gameplay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gameplay-evidence-${{ matrix.shard }}
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/screenshots/
            client-game-tests.log
            artifacts/review/test-manifest.json

  # Acceptance is only the exact all-four union from this workflow run and attempt.
  full-client-gate:
    name: Full client / all four shards
    needs: [game-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download same-run strict shard manifests
        id: shard-evidence
        uses: actions/download-artifact@v8
        with:
          pattern: full-client-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/full-client-shards
          merge-multiple: false
          digest-mismatch: error
      - name: Require complete exact all-four coverage
        if: always()
        env:
          FULL_CLIENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SHARDS_RESULT: ${{ needs.game-tests.result }}
          DOWNLOAD_RESULT: ${{ steps.shard-evidence.outcome }}
        run: >-
          python tools/full_client_ci.py
          --artifact-root artifacts/full-client-shards
          --head-sha "$FULL_CLIENT_HEAD_SHA" --workflow-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --shards-result "$SHARDS_RESULT" --download-result "$DOWNLOAD_RESULT"
          --output artifacts/review/full-client-aggregate.json
      - name: Preserve full-client aggregate outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-client-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/review/full-client-aggregate.json
          if-no-files-found: error

  # Three mandatory disjoint Masters parts; all must pass and none replaces the four full shards.
  masters-native:
    name: Masters update / ${{ matrix.part }} (required part)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        part: [masters-core, masters-march-mechanics, masters-march-visuals]
    env:
      MASTERS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install existing image-verification dependency
        run: pip install pillow
      - uses: gradle/actions/setup-gradle@v6
      - name: Check native CI selection and evidence tooling
        run: python -m unittest discover -s tools -p 'test_*ci*.py' -v
      - name: Check bounded native screenshot packaging
        run: python -m unittest discover -s tools -p 'test_curate_masters_frames.py' -v
      - name: Install virtual display
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo -n timeout --kill-after=15s 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --error-on=any update
          sudo -n timeout --kill-after=15s 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb libgl1-mesa-dri libegl1 mesa-utils
          for native_package in xvfb libgl1-mesa-dri libegl1 mesa-utils; do
            native_status="$(dpkg-query --show --showformat='${db:Status-Status}' "$native_package")"
            test "$native_status" = installed
            native_version="$(dpkg-query --show --showformat='${Version}' "$native_package")"
            test -n "$native_version"
            printf '%s=%s\n' "$native_package" "$native_version"
          done
          command -v Xvfb
          command -v glxinfo
      - name: Mark fresh Masters screenshot inputs
        continue-on-error: true
        run: python tools/curate_masters_frames.py --prepare --marker artifacts/review/masters-frames-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Mark fresh Void Cut diagnostic inputs
        id: void-cut-start
        continue-on-error: true
        run: python tools/collect_void_cut_diagnostics.py --prepare --job-group masters-native --marker artifacts/review/void-cut-masters-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Run mandatory Masters part
        timeout-minutes: 85
        env:
          CI_MINECRAFT_EULA_ACCEPTED: "true"
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEO_FORCE_EGL: "1"
        run: python tools/run_client_ci.py --suite ${{ matrix.part }} --log masters-native.log
      - name: Record required Masters part outcomes
        if: always()
        run: python tools/test_manifest.py --suite ${{ matrix.part }} --log masters-native.log --output artifacts/review/masters-native-manifest.json
      - name: Preserve original March diagnostics (not visual acceptance)
        if: always() && hashFiles('build/run/clientGameTest/screenshots/stone_fault_march_rigid_front_gather.png', 'build/run/clientGameTest/screenshots/stone_fault_march_rigid_front_first_strike.png', 'build/run/clientGameTest/screenshots/stone_fault_march_rigid_front_extraction.png', 'build/run/clientGameTest/screenshots/stone_fault_march_rigid_wide_warning.png', 'build/run/clientGameTest/screenshots/stone_fault_march_segmented_front_first_strike.png', 'build/run/clientGameTest/screenshots/stone_fault_march_segmented_wide_spent_first.png', 'build/run/clientGameTest/screenshots/stone_fault_march_segmented_wide_spent_all.png', 'build/run/clientGameTest/screenshots/stone_fault_march_opponent_segmented_fov90_normal_inward_warning.png', 'build/run/clientGameTest/screenshots/stone_fault_march_opponent_segmented_fov90_reduced_inward_warning.png') != ''
        uses: actions/upload-artifact@v7
        with:
          name: stone-march-diagnostics-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.part }}
          path: |
            build/run/clientGameTest/screenshots/stone_fault_march_rigid_front_gather.png
            build/run/clientGameTest/screenshots/stone_fault_march_rigid_front_gather.json
            build/run/clientGameTest/screenshots/stone_fault_march_rigid_front_first_strike.png
            build/run/clientGameTest/screenshots/stone_fault_march_rigid_front_first_strike.json
            build/run/clientGameTest/screenshots/stone_fault_march_rigid_front_extraction.png
            build/run/clientGameTest/screenshots/stone_fault_march_rigid_front_extraction.json
            build/run/clientGameTest/screenshots/stone_fault_march_rigid_wide_warning.png
            build/run/clientGameTest/screenshots/stone_fault_march_rigid_wide_warning.json
            build/run/clientGameTest/screenshots/stone_fault_march_segmented_front_first_strike.png
            build/run/clientGameTest/screenshots/stone_fault_march_segmented_front_first_strike.json
            build/run/clientGameTest/screenshots/stone_fault_march_segmented_wide_spent_first.png
            build/run/clientGameTest/screenshots/stone_fault_march_segmented_wide_spent_first.json
            build/run/clientGameTest/screenshots/stone_fault_march_segmented_wide_spent_all.png
            build/run/clientGameTest/screenshots/stone_fault_march_segmented_wide_spent_all.json
            build/run/clientGameTest/screenshots/stone_fault_march_opponent_segmented_fov90_normal_inward_warning.png
            build/run/clientGameTest/screenshots/stone_fault_march_opponent_segmented_fov90_normal_inward_warning.json
            build/run/clientGameTest/screenshots/stone_fault_march_opponent_segmented_fov90_reduced_inward_warning.png
            build/run/clientGameTest/screenshots/stone_fault_march_opponent_segmented_fov90_reduced_inward_warning.json
            artifacts/review/masters-native-manifest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve original Kiln diagnostics (not visual acceptance)
        if: always() && hashFiles('build/run/clientGameTest/screenshots/ember_kiln_*.png') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ember-kiln-diagnostics-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.part }}
          path: |
            build/run/clientGameTest/screenshots/ember_kiln_rigid_front_coil.png
            build/run/clientGameTest/screenshots/ember_kiln_rigid_front_coil.json
            build/run/clientGameTest/screenshots/ember_kiln_rigid_front_release.png
            build/run/clientGameTest/screenshots/ember_kiln_rigid_front_release.json
            build/run/clientGameTest/screenshots/ember_kiln_rigid_front_recovery.png
            build/run/clientGameTest/screenshots/ember_kiln_rigid_front_recovery.json
            build/run/clientGameTest/screenshots/ember_kiln_rigid_wide_warning.png
            build/run/clientGameTest/screenshots/ember_kiln_rigid_wide_warning.json
            build/run/clientGameTest/screenshots/ember_kiln_segmented_front_coil.png
            build/run/clientGameTest/screenshots/ember_kiln_segmented_front_coil.json
            build/run/clientGameTest/screenshots/ember_kiln_segmented_front_release.png
            build/run/clientGameTest/screenshots/ember_kiln_segmented_front_release.json
            build/run/clientGameTest/screenshots/ember_kiln_segmented_front_recovery.png
            build/run/clientGameTest/screenshots/ember_kiln_segmented_front_recovery.json
            build/run/clientGameTest/screenshots/ember_kiln_segmented_wide_warning.png
            build/run/clientGameTest/screenshots/ember_kiln_segmented_wide_warning.json
            build/run/clientGameTest/screenshots/ember_kiln_opponent_segmented_fov90_normal_inward_warning.png
            build/run/clientGameTest/screenshots/ember_kiln_opponent_segmented_fov90_normal_inward_warning.json
            build/run/clientGameTest/screenshots/ember_kiln_opponent_segmented_fov90_reduced_inward_warning.png
            build/run/clientGameTest/screenshots/ember_kiln_opponent_segmented_fov90_reduced_inward_warning.json
            artifacts/review/masters-native-manifest.json
          if-no-files-found: warn
      - name: Preserve Red Rain diagnostic frames (not visual acceptance)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: masters-red-rain-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.part }}
          path: |
            build/run/clientGameTest/screenshots/masters_style_red_rain_left_turn_first_windup.png
            build/run/clientGameTest/screenshots/masters_style_red_rain_left_turn_first_windup.json
            build/run/clientGameTest/screenshots/masters_style_red_rain_first_windup.png
            build/run/clientGameTest/screenshots/masters_style_red_rain_first_windup.json
            build/run/clientGameTest/screenshots/masters_style_red_rain_left_turn_third_back_windup.json
          if-no-files-found: warn
      - name: Collect bounded Void Cut diagnostics (may include rejected frames)
        id: void-cut-diagnostics
        if: always() && steps.void-cut-start.outcome == 'success'
        continue-on-error: true
        run: python tools/collect_void_cut_diagnostics.py --job-group masters-native --marker artifacts/review/void-cut-masters-${{ github.run_id }}-${{ github.run_attempt }}.json --output artifacts/review/void-cut-diagnostics-masters-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve bounded Void Cut diagnostics
        if: always() && steps.void-cut-diagnostics.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: void-cut-diagnostics-masters-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.part }}
          path: artifacts/review/void-cut-diagnostics-masters-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Curate bounded native Masters frames
        id: curated-masters
        if: always()
        continue-on-error: true
        run: python tools/curate_masters_frames.py --marker artifacts/review/masters-frames-${{ github.run_id }}-${{ github.run_attempt }}.json --output artifacts/review/masters-native-curated-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve bounded native Masters frames
        if: always() && steps.curated-masters.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: masters-native-curated-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.part }}
          path: artifacts/review/masters-native-curated-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Preserve original Reweave player diagnostics (not visual acceptance)
        if: always() && hashFiles('artifacts/review/masters-native-manifest.json') != '' && hashFiles('build/run/clientGameTest/screenshots/reweave_grimoire_retrieval.png', 'build/run/clientGameTest/screenshots/reweave_ebb_ledger_history.png', 'build/run/clientGameTest/screenshots/reweave_ebb_ledger_controls.png', 'build/run/clientGameTest/screenshots/reweave_learned_equipped_row.png', 'build/run/clientGameTest/screenshots/reweave_paid_disc_rebound_cast.png', 'build/run/clientGameTest/screenshots/reweave_paid_lane_warning.png', 'build/run/clientGameTest/screenshots/reweave_paid_lane_dummy_hit.png') != ''
        uses: actions/upload-artifact@v7
        with:
          name: reweave-player-masters-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.part }}
          path: |
            build/run/clientGameTest/screenshots/reweave_grimoire_retrieval.png
            build/run/clientGameTest/screenshots/reweave_ebb_ledger_history.png
            build/run/clientGameTest/screenshots/reweave_ebb_ledger_controls.png
            build/run/clientGameTest/screenshots/reweave_learned_equipped_row.png
            build/run/clientGameTest/screenshots/reweave_paid_disc_rebound_cast.png
            build/run/clientGameTest/screenshots/reweave_paid_lane_warning.png
            build/run/clientGameTest/screenshots/reweave_paid_lane_dummy_hit.png
            artifacts/review/masters-native-manifest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve required Masters part evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: masters-native-evidence-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.part }}
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/screenshots/
            masters-native.log
            artifacts/review/masters-native-manifest.json

  # Mandatory replacement for charge-owning fake PvP recipients: two actual TCP clients.
  connected-combat-native:
    name: Connected cast receipts (54 cases, 2 widths) and Moon (4 views)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install existing image-verification dependency
        run: pip install pillow
      - name: Verify bounded two-client supervision
        run: |
          python -m unittest discover -s tools -p 'test_two_client_supervisor.py' -v
          python -m unittest discover -s tools -p 'test_moon_two_client_supervisor.py' -v
          python -m unittest discover -s tools -p 'test_paired_moon_matrix.py' -v
          python -m unittest discover -s tools -p 'test_curate_moon_frames.py' -v
      - name: Install existing virtual-display dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo -n timeout --kill-after=15s 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --error-on=any update
          sudo -n timeout --kill-after=15s 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb libgl1-mesa-dri libegl1 mesa-utils
          for native_package in xvfb libgl1-mesa-dri libegl1 mesa-utils; do
            native_status="$(dpkg-query --show --showformat='${db:Status-Status}' "$native_package")"
            test "$native_status" = installed
            native_version="$(dpkg-query --show --showformat='${Version}' "$native_package")"
            test -n "$native_version"
            printf '%s=%s\n' "$native_package" "$native_version"
          done
          command -v Xvfb
          command -v glxinfo
      - name: Run both 54-case widths then four sequential Moon views
        timeout-minutes: 51
        env:
          CI_MINECRAFT_EULA_ACCEPTED: "true"
          WILDERCORD_PR_HEAD_SHA: "${{ github.event.pull_request.head.sha || '' }}"
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEO_FORCE_EGL: "1"
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' python tools/native/run_paired_matrix.py --output build/native/paired-matrix --total-timeout 3000
      - name: Preserve both clients and partial failure evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: connected-combat-native-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            build/native/**/*.json
            build/native/**/*.properties
            build/native/**/*.log
            build/native/**/screenshots/**
      - name: Curate original paired Moon frames (visual review pending)
        id: curated-moon
        if: always()
        continue-on-error: true
        env:
          WILDERCORD_PR_HEAD_SHA: "${{ github.event.pull_request.head.sha || '' }}"
        run: python tools/curate_moon_frames.py --output artifacts/review/paired-moon-curated-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve bounded paired Moon originals and diagnostic index
        if: always() && steps.curated-moon.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: paired-moon-curated-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/review/paired-moon-curated-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

  # Opt-in renderer acceptance only; all existing Masters and full-descriptor gates remain.
  articulated-native:
    name: articulated-native (6 focused suites)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install existing image-verification dependency
        run: pip install pillow
      - uses: gradle/actions/setup-gradle@v6
      - name: Check passive shared-render receipt tooling
        run: python tools/check_articulated_render_receipts.py
      - name: Check native CI selection and evidence tooling
        run: python -m unittest discover -s tools -p 'test_*ci*.py' -v
      - name: Check bounded native screenshot packaging
        run: python -m unittest discover -s tools -p 'test_curate_masters_frames.py' -v
      - name: Install virtual display
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo -n timeout --kill-after=15s 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --error-on=any update
          sudo -n timeout --kill-after=15s 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb libgl1-mesa-dri libegl1 mesa-utils
          for native_package in xvfb libgl1-mesa-dri libegl1 mesa-utils; do
            native_status="$(dpkg-query --show --showformat='${db:Status-Status}' "$native_package")"
            test "$native_status" = installed
            native_version="$(dpkg-query --show --showformat='${Version}' "$native_package")"
            test -n "$native_version"
            printf '%s=%s\n' "$native_package" "$native_version"
          done
          command -v Xvfb
          command -v glxinfo
      - name: Mark fresh articulated screenshot inputs
        continue-on-error: true
        run: python tools/curate_masters_frames.py --suite articulated --prepare --marker artifacts/review/articulated-frames-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Run the six articulated native suites
        env:
          CI_MINECRAFT_EULA_ACCEPTED: "true"
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEO_FORCE_EGL: "1"
        run: python tools/run_articulated_receipt_gate.py --include-opening --log articulated-native.log --output artifacts/review/articulated-native-receipts-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve complete bounded render-receipt metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: articulated-render-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/review/articulated-native-receipts-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
      - name: Record focused articulated outcomes
        if: always()
        run: python tools/test_manifest.py --suite articulated --log articulated-native.log --output artifacts/review/articulated-native-manifest.json
      - name: Preserve native settings UI samples (review pending)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combat-settings-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/run/clientGameTest/screenshots/combat_settings_640.png
            build/run/clientGameTest/screenshots/combat_settings_854.png
            build/run/clientGameTest/screenshots/combat_settings_1920.png
          if-no-files-found: warn
      - name: Collect exact logged Moon owner receipt and original frame
        id: curated-moon-owner
        if: always()
        continue-on-error: true
        run: python tools/curate_moon_frames.py --owner --output artifacts/review/moon-owner-curated-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve original Moon owner FP diagnostic frame and receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crimson-moon-owner-fp-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/run/clientGameTest/screenshots/crimson_moon_owner_fp_slim_articulated_netherite_funded_right_release.png
            build/run/clientGameTest/screenshots/crimson_moon_owner_fp_wide_articulated_netherite_funded_right_release.png
            artifacts/review/moon-owner-curated-${{ github.run_id }}-${{ github.run_attempt }}/
