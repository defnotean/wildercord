name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'wiki/**'
      - 'gitbook/**'
      - '.gitbook.yaml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/audit/**'
      - 'docs/features/**'
      - 'docs/releases/**'
      - 'tools/player_docs.py'
      - 'tools/check_player_site.py'
      - '.github/workflows/docs.yml'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v6

      # Assets, recipes, language and docs/RECIPES.md are generated from the code. If a change to
      # the runes wasn't followed by `python tools/generate_assets.py`, fail here and say so.
      - name: Check generated files are up to date
        run: |
          pip install pillow
          python tools/check_generated_assets.py

      - name: Build and run unit tests
        run: ./gradlew build --stacktrace

      - name: Check bounded packaging audit
        run: python -m unittest discover -s tools -p 'test_audit_packages.py' -v

      - name: Package pinned launcher profiles
        run: |
          task_release_jar=$(find build/libs -maxdepth 1 -name 'wildercord-*.jar' ! -name '*-sources.jar' -print -quit)
          python tools/build_profiles.py --jar "$task_release_jar"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: wildercord
          path: build/libs/*.jar

      - name: Upload launcher profiles
        uses: actions/upload-artifact@v7
        with:
          name: wildercord-profiles
          path: artifacts/profiles/*.mrpack

      - name: Audit mod and launcher packaging (not gameplay readiness)
        id: packaging
        run: python tools/audit_packages.py --output artifacts/review/packaging-report.json --distributable-directory artifacts/releases/distributable

      - name: Preserve packaging report
        if: always() && steps.packaging.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: wildercord-packaging-report
          path: artifacts/review/packaging-report.json
          if-no-files-found: error

      - name: Upload distributable mod jar only
        uses: actions/upload-artifact@v7
        with:
          name: wildercord-distributable
          path: artifacts/releases/distributable/*.jar
          if-no-files-found: error

  # The full client descriptor takes several hours in one job, so it runs as four contiguous shards.
  # Each shard keeps the declared test order; together they cover every entrypoint exactly once.
  game-tests:
    name: game-tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 mesa-utils
      - name: Mark fresh Void Cut diagnostic inputs
        id: void-cut-start
        continue-on-error: true
        run: python tools/collect_void_cut_diagnostics.py --prepare --job-group game-tests-${{ matrix.shard }}-of-4 --marker artifacts/review/void-cut-game-tests-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Run gameplay and complete rune animation gallery
        env:
          CI_MINECRAFT_EULA_ACCEPTED: "true"
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEO_FORCE_EGL: "1"
          WILDERCORD_ANIMATION_GALLERY: "1"
        run: python tools/run_client_ci.py --shard ${{ matrix.shard }}/4 --log client-game-tests.log
      - name: Record full descriptor and optional suite outcomes
        if: always()
        run: python tools/test_manifest.py --shard ${{ matrix.shard }}/4 --log client-game-tests.log --gallery
      - name: Collect bounded Void Cut diagnostics (may include rejected frames)
        id: void-cut-diagnostics
        if: always() && steps.void-cut-start.outcome == 'success'
        continue-on-error: true
        run: python tools/collect_void_cut_diagnostics.py --job-group game-tests-${{ matrix.shard }}-of-4 --marker artifacts/review/void-cut-game-tests-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}.json --output artifacts/review/void-cut-diagnostics-game-tests-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve bounded Void Cut diagnostics
        if: always() && steps.void-cut-diagnostics.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: void-cut-diagnostics-game-tests-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/review/void-cut-diagnostics-game-tests-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Preserve gameplay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gameplay-evidence-${{ matrix.shard }}
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/screenshots/
            client-game-tests.log
            artifacts/review/test-manifest.json

  # Additional focused evidence for the Masters foundation; never replaces the four full shards.
  masters-native:
    name: Masters update (27 focused suites)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install existing image-verification dependency
        run: pip install pillow
      - uses: gradle/actions/setup-gradle@v6
      - name: Check native CI selection and evidence tooling
        run: python -m unittest discover -s tools -p 'test_*ci*.py' -v
      - name: Check bounded native screenshot packaging
        run: python -m unittest discover -s tools -p 'test_curate_masters_frames.py' -v
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 mesa-utils
      - name: Mark fresh Masters screenshot inputs
        continue-on-error: true
        run: python tools/curate_masters_frames.py --prepare --marker artifacts/review/masters-frames-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Mark fresh Void Cut diagnostic inputs
        id: void-cut-start
        continue-on-error: true
        run: python tools/collect_void_cut_diagnostics.py --prepare --job-group masters-native --marker artifacts/review/void-cut-masters-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Run the 27 focused update suites
        env:
          CI_MINECRAFT_EULA_ACCEPTED: "true"
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEO_FORCE_EGL: "1"
        run: python tools/run_client_ci.py --suite masters --log masters-native.log
      - name: Record focused Masters outcomes
        if: always()
        run: python tools/test_manifest.py --suite masters --log masters-native.log --output artifacts/review/masters-native-manifest.json
      - name: Preserve Red Rain diagnostic frames (not visual acceptance)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: masters-red-rain-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/run/clientGameTest/screenshots/masters_style_red_rain_left_turn_first_windup.png
            build/run/clientGameTest/screenshots/masters_style_red_rain_left_turn_first_windup.json
            build/run/clientGameTest/screenshots/masters_style_red_rain_first_windup.png
            build/run/clientGameTest/screenshots/masters_style_red_rain_first_windup.json
            build/run/clientGameTest/screenshots/masters_style_red_rain_left_turn_third_back_windup.json
          if-no-files-found: warn
      - name: Collect bounded Void Cut diagnostics (may include rejected frames)
        id: void-cut-diagnostics
        if: always() && steps.void-cut-start.outcome == 'success'
        continue-on-error: true
        run: python tools/collect_void_cut_diagnostics.py --job-group masters-native --marker artifacts/review/void-cut-masters-${{ github.run_id }}-${{ github.run_attempt }}.json --output artifacts/review/void-cut-diagnostics-masters-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve bounded Void Cut diagnostics
        if: always() && steps.void-cut-diagnostics.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: void-cut-diagnostics-masters-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/review/void-cut-diagnostics-masters-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Curate bounded native Masters frames
        id: curated-masters
        if: always()
        continue-on-error: true
        run: python tools/curate_masters_frames.py --marker artifacts/review/masters-frames-${{ github.run_id }}-${{ github.run_attempt }}.json --output artifacts/review/masters-native-curated-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve bounded native Masters frames
        if: always() && steps.curated-masters.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: masters-native-curated-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/review/masters-native-curated-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Preserve focused Masters evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: masters-native-evidence
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/screenshots/
            masters-native.log
            artifacts/review/masters-native-manifest.json

  # Opt-in renderer acceptance only; all existing Masters and full-descriptor gates remain.
  articulated-native:
    name: articulated-native (5 focused suites)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install existing image-verification dependency
        run: pip install pillow
      - uses: gradle/actions/setup-gradle@v6
      - name: Check passive shared-render receipt tooling
        run: python tools/check_articulated_render_receipts.py
      - name: Check native CI selection and evidence tooling
        run: python -m unittest discover -s tools -p 'test_*ci*.py' -v
      - name: Check bounded native screenshot packaging
        run: python -m unittest discover -s tools -p 'test_curate_masters_frames.py' -v
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 mesa-utils
      - name: Mark fresh articulated screenshot inputs
        continue-on-error: true
        run: python tools/curate_masters_frames.py --suite articulated --prepare --marker artifacts/review/articulated-frames-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Run the five articulated native suites
        env:
          CI_MINECRAFT_EULA_ACCEPTED: "true"
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEO_FORCE_EGL: "1"
        run: python tools/run_articulated_receipt_gate.py --include-opening --log articulated-native.log --output artifacts/review/articulated-native-receipts-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve complete bounded render-receipt metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: articulated-render-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/review/articulated-native-receipts-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
      - name: Record focused articulated outcomes
        if: always()
        run: python tools/test_manifest.py --suite articulated --log articulated-native.log --output artifacts/review/articulated-native-manifest.json
      - name: Preserve native settings UI samples (review pending)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combat-settings-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/run/clientGameTest/screenshots/combat_settings_640.png
            build/run/clientGameTest/screenshots/combat_settings_854.png
            build/run/clientGameTest/screenshots/combat_settings_1920.png
          if-no-files-found: warn
      - name: Curate bounded native articulated frames
        id: curated-articulated
        if: always()
        continue-on-error: true
        run: python tools/curate_masters_frames.py --suite articulated --marker artifacts/review/articulated-frames-${{ github.run_id }}-${{ github.run_attempt }}.json --opening-receipt-report artifacts/review/articulated-native-receipts-${{ github.run_id }}-${{ github.run_attempt }}/opening-association-report.json --output artifacts/review/articulated-native-curated-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve bounded native articulated frames
        if: always() && steps.curated-articulated.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: articulated-native-curated-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/review/articulated-native-curated-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Preserve focused articulated evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: articulated-native-evidence
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/screenshots/
            articulated-native.log
            artifacts/review/articulated-native-manifest.json

  # One explicit request commit atop sourceSha; later commits make it inactive.
  # This evidence never replaces any aggregate or focused release gate above.
  native-diagnostic:
    name: native-diagnostic (not release acceptance)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: native-diagnostic-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      NATIVE_DIAGNOSTIC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CI_MINECRAFT_EULA_ACCEPTED: "true"
      NATIVE_DIAGNOSTIC_PR: ${{ github.event.pull_request.number }}
      LIBGL_ALWAYS_SOFTWARE: "1"
      SDL_VIDEO_FORCE_EGL: "1"
      ALSOFT_DRIVERS: "null"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate explicit diagnostic request and exact source revision
        id: request
        run: python tools/run_native_diagnostic_ci.py --prepare
      - uses: actions/setup-java@v6
        if: steps.request.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        if: steps.request.outputs.enabled == 'true'
      - name: Check diagnostic request, scope and provenance tooling
        if: steps.request.outputs.enabled == 'true'
        run: python -m unittest discover -s tools -p 'test_*ci*.py' -v
      - name: Install virtual display for requested diagnostic
        if: steps.request.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 mesa-utils
      - name: Run one allowlisted native diagnostic, without retries
        if: steps.request.outputs.enabled == 'true'
        timeout-minutes: 50
        run: python tools/run_native_diagnostic_ci.py --run
      - name: Record bounded diagnostic evidence, never release acceptance
        if: always() && steps.request.outputs.enabled == 'true'
        run: python tools/run_native_diagnostic_ci.py --collect
      - name: Preserve diagnostic request and native evidence
        if: always() && steps.request.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: native-diagnostic-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/review/native-diagnostic/
          if-no-files-found: error
          retention-days: 7
