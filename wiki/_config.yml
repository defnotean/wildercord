title: Wildercord Player Guide
description: "Wildercord 0.9.0-alpha: build spells that grow with you, walk the swordsman's path of aura, and meet the creatures of an enchanted world."
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
permalink: pretty
color_scheme: dark
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
logo: "/assets/images/logo.png"
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  button: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
aux_links:
  "Download on CurseForge":
    - "https://www.curseforge.com/minecraft/mc-mods/wildercord"
  "GitHub":
    - "https://github.com/defnotean/wildercord"
aux_links_new_tab: true
footer_content: "Wildercord is open source under the MIT License. Not an official Minecraft product; not approved by or associated with Mojang or Microsoft."
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

url: https://defnotean.github.io
baseurl: /wildercord
