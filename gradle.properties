# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Reuse task outputs across VPS runs; the configuration cache stays off until the custom tasks are audited for it.
org.gradle.caching=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.3
loader_version=0.20.1
loom_version=1.19.4
java_version=21

# Mod Properties
mod_version=0.15.0-alpha
maven_group=dev.wildercord

# Dependencies
fabric_api_version=0.114.1+1.21.3
# Optional: shader support is compiled against Iris, and `-Pshaders` runs with both
iris_version=1.8.1+1.21.3-fabric
sodium_version=mc1.21.3-0.6.1-fabric
